<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>SVT Dream Bank</title>
    <style>
        :root { --rose: #F7CAC9; --serenity: #92A8D1; --text-gray: #8e8e93; }
        body { font-family: -apple-system, system-ui, sans-serif; background: #fdfbfb; margin: 0; padding-bottom: 140px; user-select: none; -webkit-user-select: none; }
        
        /* 標頭適配動態島 */
        .header { background: linear-gradient(to right, var(--rose), var(--serenity)); color: white; padding: 55px 15px 15px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .header h1 { margin: 0; font-size: 18px; font-weight: 800; }

        .top-card { background: white; margin: 15px; padding: 20px; border-radius: 20px; border: 2.5px solid var(--rose); display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .total-val { color: #e84393; font-size: 28px; font-weight: 900; }
        #dateInput { border: none; font-size: 16px; font-weight: bold; color: #666; width: 135px; background: transparent; outline: none; }

        .m-bar { background: #f0f0f2; margin: 0 15px 15px; padding: 12px; border-radius: 15px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        #customQty { width: 60px; padding: 8px; border: 1.5px solid var(--serenity); border-radius: 10px; text-align: center; font-size: 16px; font-weight: bold; color: var(--serenity); outline: none; }

        .card { background: white; margin: 15px; padding: 20px; border-radius: 22px; border: 1px solid #efefef; box-shadow: 0 5px 15px rgba(0,0,0,0.04); }
        .card-title { font-size: 18px; font-weight: bold; margin-bottom: 15px; display: flex; align-items: baseline; gap: 8px; }
        .ko-name { font-size: 13px; color: var(--text-gray); font-weight: normal; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn { padding: 15px 5px; border-radius: 14px; border: 1px solid #f2f2f2; background: #fff; font-size: 13px; font-weight: 600; color: #444; }
        .btn:active { background: #f0f0f0; transform: scale(0.96); }
        .btn-yellow { background-color: #FFF9C4 !important; border-color: #FBC02D !important; color: #F57F17 !important; }
        .btn-purple { background-color: #F3E5F5 !important; border-color: #9C27B0 !important; color: #9C27B0 !important; }

        /* 輸入框佈局修正 */
        .input-item { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; width: 100%; }
        .input-item label { font-size: 12px; color: var(--text-gray); font-weight: bold; margin-left: 5px; }
        .input-item input { padding: 12px; border-radius: 12px; border: 1px solid #ddd; width: 100%; box-sizing: border-box; font-size: 16px; background: #fcfcfc; -webkit-appearance: none; }

        .log-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .day-subtotal { background: var(--rose); color: white; padding: 2px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }

        .ticket { background: #fff; border-left: 8px solid var(--serenity); position: relative; overflow: hidden; }
        .ticket-price { color: #e84393; font-weight: bold; font-size: 18px; margin-top: 5px; display: block; }

        .logs { background: #fafafa; margin: 15px; padding: 15px; border-radius: 15px; border: 1px dashed #ddd; }
        .log-line { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f0f0f0; font-size: 13px; }

        .footer { position: fixed; bottom: 0; width: 100%; background: rgba(255,255,255,0.92); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); padding: 15px 15px 40px; display: flex; gap: 12px; border-top: 1px solid #eee; box-sizing: border-box; z-index: 9999; }
        .f-btn { flex: 1; padding: 16px; border-radius: 30px; border: none; font-weight: bold; font-size: 16px; }
        .f-on { background: var(--rose); color: white; }
        .f-off { background: white; border: 1.5px solid var(--serenity); color: var(--serenity); }

        .hidden { display: none; }
    </style>
</head>
<body>

<div class="header"><h1>💎 2026 SVT Dream Bank</h1></div>

<div class="top-card">
    <input type="date" id="dateInput" onchange="changeDate()">
    <div class="total-val">$<span id="money">0</span></div>
</div>

<div id="save-page">
    <div class="m-bar">
        <span style="font-size:14px; font-weight:bold; color:#555;">本次次數：</span>
        <input type="number" id="customQty" value="1" min="1">
    </div>
    <div id="m-list"></div>
    <div class="logs">
        <div class="log-header">
            <span style="font-weight:bold; color:#999;">📋 今日明細</span>
            <span class="day-subtotal" id="daySum">今日小計: $0</span>
        </div>
        <div id="log-list"></div>
    </div>
</div>

<div id="concert-page" class="hidden">
    <div class="card" style="border: 2px solid var(--serenity);">
        <h3 style="margin-top:0; color:var(--serenity); text-align:center;">🎟️ 紀錄演唱會支出</h3>
        
        <div class="input-item">
            <label>演唱會名稱</label>
            <input type="text" id="c-name" placeholder="例如：Follow to Japan">
        </div>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
            <div class="input-item">
                <label>購票日期</label>
                <input type="date" id="c-buy-date">
            </div>
            <div class="input-item">
                <label>活動日期</label>
                <input type="date" id="c-event-date">
            </div>
        </div>

        <div class="input-item">
            <label>座位資訊</label>
            <input type="text" id="c-seat" placeholder="例如：搖滾A區 100號">
        </div>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
            <div class="input-item">
                <label>票價 ($)</label>
                <input type="number" id="c-ticket" placeholder="0">
            </div>
            <div class="input-item">
                <label>手續費 ($)</label>
                <input type="number" id="c-fee" placeholder="0">
            </div>
        </div>

        <button onclick="addC()" style="width:100%; padding:16px; background:var(--serenity); color:white; border-radius:15px; border:none; font-weight:bold; font-size:16px; margin-top:5px;">確認扣款</button>
    </div>
    <div id="c-list"></div>
</div>

<div class="footer">
    <button id="n1" class="f-btn f-on" onclick="tab(1)">💰 存錢</button>
    <button id="n2" class="f-btn f-off" onclick="tab(2)">🎟️ 演唱會記錄</button>
</div>

<script>
    var state = { total: 0, currentDate: new Date().toISOString().split('T')[0], allLogs: {}, concertLogs: [] };
    var prices = {
        wonwoo: { w_p: 50, w_m: 20, w_s: 30, w_l: 200, i_p: 50, i_s: 30, i_photo: 50, i_live: 200, extra: 10 },
        others: { w_p: 20, w_m: 10, w_s: 10, w_l: 50, i_p: 20, i_s: 10, i_live: 50, extra: 10 }
    };
    var members = [
        {en:"S.coups", ko:"승철"}, {en:"Jeonghan", ko:"정한"}, {en:"Joshua", ko:"지수"},
        {en:"Jun", ko:"준휘"}, {en:"Hoshi", ko:"순영"}, {en:"Wonwoo", ko:"원우"},
        {en:"Woozi", ko:"지훈"}, {en:"The8", ko:"명호"}, {en:"Mingyu", ko:"민규"},
        {en:"DK", ko:"석민"}, {en:"Seungkwan", ko:"승관"}, {en:"Vernon", ko:"한솔"},
        {en:"Dino", ko:"찬"}
    ];

    function tab(p) {
        if(p===1) {
            document.getElementById('save-page').classList.remove('hidden');
            document.getElementById('concert-page').classList.add('hidden');
            document.getElementById('n1').className='f-btn f-on';
            document.getElementById('n2').className='f-btn f-off';
        } else {
            document.getElementById('save-page').classList.add('hidden');
            document.getElementById('concert-page').classList.remove('hidden');
            document.getElementById('n1').className='f-btn f-off';
            document.getElementById('n2').className='f-btn f-on';
            renderC();
        }
    }

    function add(name, act, p) {
        var qty = parseInt(document.getElementById('customQty').value) || 1;
        var amt = p * qty;
        if(!state.allLogs[state.currentDate]) state.allLogs[state.currentDate] = [];
        state.allLogs[state.currentDate].push({ id: Date.now(), amt: amt, text: name + " " + act + (qty>1?" (x"+qty+")":"") });
        refresh();
    }

    function live(name, isVip, plat) {
        var p = isVip ? prices.wonwoo : prices.others;
        var n_live = prompt(name + " " + plat + "直播人數？", "1");
        if(n_live) {
            var qty = parseInt(document.getElementById('customQty').value) || 1;
            var base = (plat === 'WVS' ? p.w_l : p.i_live);
            var singleTotal = parseInt(base) + (parseInt(n_live)>1 ? (parseInt(n_live)-1)*p.extra : 0);
            var finalAmt = singleTotal * qty;
            if(!state.allLogs[state.currentDate]) state.allLogs[state.currentDate] = [];
            state.allLogs[state.currentDate].push({ id: Date.now(), amt: finalAmt, text: name + " " + plat + "直播(" + n_live + "人)" + (qty>1?" (x"+qty+")":"") });
            refresh();
        }
    }

    function addC() {
        var name = document.getElementById('c-name').value;
        var p = parseInt(document.getElementById('c-ticket').value) || 0;
        var f = parseInt(document.getElementById('c-fee').value) || 0;
        if(!name) return;
        state.concertLogs.push({
            id: Date.now(), name: name, buyDate: document.getElementById('c-buy-date').value,
            eventDate: document.getElementById('c-event-date').value, seat: document.getElementById('c-seat').value,
            price: p, fee: f, totalCost: p + f
        });
        ["c-name", "c-buy-date", "c-event-date", "c-seat", "c-ticket", "c-fee"].forEach(id => document.getElementById(id).value = "");
        refresh();
        renderC();
    }

    function renderC() {
        var h = "";
        // 複製一份陣列並依活動日期 (eventDate) 由遠到近排序
        var sortedLogs = [...state.concertLogs].sort(function(a, b) {
            var dateA = a.eventDate ? new Date(a.eventDate).getTime() : 0;
            var dateB = b.eventDate ? new Date(b.eventDate).getTime() : 0;
            return dateB - dateA; 
        });

        for(var i=0; i<sortedLogs.length; i++) {
            var c = sortedLogs[i];
            h += `<div class="card ticket"><span style="position:absolute;right:15px;top:15px;color:red;font-size:18px;" onclick="delC(${c.id})">✖</span>
                <b style="color:#333;">✨ ${c.name}</b><br>
                <small>📍 ${c.seat || '未填'} | 🎫 ${c.buyDate || '未填'}</small><br>
                <small>📅 活動日: ${c.eventDate || '未填'}</small><br>
                <span class="ticket-price">-$${c.totalCost.toLocaleString()}</span></div>`;
        }
        document.getElementById('c-list').innerHTML = h || '<div style="color:#ccc;text-align:center;padding:20px;">尚無演唱會紀錄</div>';
    }

    function delC(id) { if(confirm("確定刪除此演唱會紀錄？")) { state.concertLogs = state.concertLogs.filter(c => c.id !== id); refresh(); renderC(); } }

    function refresh() {
        var inc = 0, exp = 0, dayTotal = 0;
        for(var d in state.allLogs) {
            state.allLogs[d].forEach(l => { 
                inc += l.amt; 
                if(d === state.currentDate) dayTotal += l.amt; 
            });
        }
        state.concertLogs.forEach(c => exp += c.totalCost);
        state.total = inc - exp;
        document.getElementById('daySum').innerText = "今日小計: $" + dayTotal.toLocaleString();
        localStorage.setItem('SVT_FINAL_STABLE_V1', JSON.stringify(state));
        updateUI();
    }

    function updateUI() {
        document.getElementById('money').innerText = state.total.toLocaleString();
        document.getElementById('dateInput').value = state.currentDate;
        var logs = state.allLogs[state.currentDate] || [];
        var h = "";
        for(var i=logs.length-1; i>=0; i--) {
            h += '<div class="log-line"><span>'+logs[i].text+' ($'+logs[i].amt+')</span><b style="color:red;padding:5px;" onclick="delL('+logs[i].id+')">✖</b></div>';
        }
        document.getElementById('log-list').innerHTML = h || '<div style="color:#ccc;text-align:center;padding:10px;">尚未有紀錄</div>';
    }

    function delL(id) { state.allLogs[state.currentDate] = state.allLogs[state.currentDate].filter(l => l.id !== id); refresh(); }

    function changeDate() { state.currentDate = document.getElementById('dateInput').value; refresh(); }

    window.onload = function() {
        var saved = localStorage.getItem('SVT_FINAL_STABLE_V1');
        if(saved) {
            state = JSON.parse(saved);
        }
        // 強制將當前日期設定為「今天」
        state.currentDate = new Date().toISOString().split('T')[0];
        
        if(!state.concertLogs) state.concertLogs = [];
        var list = document.getElementById('m-list');
        members.forEach(function(m){
            var isV = (m.en === "Wonwoo"), p = isV ? prices.wonwoo : prices.others;
            var div = document.createElement('div');
            div.className = 'card';
            var btns = `<button class="btn" onclick="add('${m.en}','WVS發文',${p.w_p})">WVS發文</button><button class="btn" onclick="add('${m.en}','WVS留言',${p.w_m})">WVS留言</button><button class="btn" onclick="add('${m.en}','WVS限動',${p.w_s})">WVS限動</button><button class="btn btn-yellow" onclick="live('${m.en}',${isV},'WVS')">WVS直播</button><button class="btn" onclick="add('${m.en}','IG發文',${p.i_p})">IG發文</button><button class="btn" onclick="add('${m.en}','IG限動',${p.i_s})">IG限動</button><button class="btn btn-yellow" onclick="live('${m.en}',${isV},'IG')">IG直播</button>`;
            if(isV) btns += `<button class="btn btn-purple" onclick="add('${m.en}','IG攝影帳',${p.i_photo})">IG攝影帳</button>`;
            div.innerHTML = `<div class="card-title">${m.en} <span class="ko-name">${m.ko}</span> ${isV?'💜':''}</div><div class="grid">${btns}</div>`;
            list.appendChild(div);
        });
        refresh();
    };
</script>
</body>
</html>
